[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bfb-gasifier"
version = "0.1.0"
description = "鼓泡流化床气化炉一维稳态动力学模型"
readme = "docs/techspec.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: 完整反应器扫描集成测试（约数十秒）",
]
